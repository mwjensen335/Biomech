version: '3.9'

services:
  database:
    container_name: biomech-postgres
    image: postgres:18
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"

  django:
    container_name: biomech-backend
    image: biomech-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: 
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - database

volumes:
  pgdata: